name: Python Lint (Ruff) & CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff-lint:
    name: Ruff Linter & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github ."

      - name: Verify Python bytecode compilation
        run: python -m compileall -q mcp_factory plugins tests

  validate-and-test:
    name: Validate Blueprints & Run Pytest
    runs-on: ubuntu-latest
    needs: ruff-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Validate Declarative JSON Blueprints
        run: |
          mcp-factory validate configs/ecommerce_service.json
          mcp-factory validate configs/gcp_cloud_ops.json

      - name: Run Automated Test Suite
        run: pytest -v

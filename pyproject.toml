[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-factory"
version = "1.0.0"
description = "A declarative, JSON-driven framework to build and deploy Model Context Protocol (MCP) servers for any backend service onto Google Cloud Run."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI Engineering Team"}
]
dependencies = [
    "mcp>=1.2.0",
    "starlette>=0.36.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "google-auth>=2.28.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
mcp-factory = "mcp_factory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_factory*", "plugins*"]

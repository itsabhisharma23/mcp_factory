<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Retro CRT Screen Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070514" />
      <stop offset="55%" stop-color="#120b2e" />
      <stop offset="100%" stop-color="#240b36" />
    </linearGradient>

    <!-- Gold / Arcade Title Gradient -->
    <linearGradient id="arcadeTitle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffb96" />
      <stop offset="45%" stop-color="#ffbe0b" />
      <stop offset="55%" stop-color="#fb5607" />
      <stop offset="100%" stop-color="#ff006e" />
    </linearGradient>

    <!-- Cyan Neon Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00bbf9" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <!-- CRT Scanline Pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.28" />
    </pattern>

    <!-- Perspective Pixel Grid Pattern -->
    <pattern id="pixelGrid" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 20" fill="none" stroke="#ff006e" stroke-width="0.7" stroke-opacity="0.22" />
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .pixel-text {
        font-family: 'Courier New', Courier, monospace;
        font-weight: 900;
        letter-spacing: 3px;
      }
      .title-text {
        font-family: 'Impact', 'Arial Black', 'Courier New', monospace;
        font-weight: 900;
        letter-spacing: 8px;
      }
      .blink {
        animation: blinker 1.1s steps(2, start) infinite;
      }
      .float-slow {
        animation: floater 2.6s ease-in-out infinite;
      }
      .pulse-border {
        animation: borderPulse 3s ease-in-out infinite;
      }
      @keyframes blinker {
        to { visibility: hidden; }
      }
      @keyframes floater {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes borderPulse {
        0%, 100% { stroke-opacity: 0.95; }
        50% { stroke-opacity: 0.45; }
      }
    </style>
  </defs>

  <!-- Main Arcade Screen Frame -->
  <rect x="4" y="4" width="992" height="332" rx="14" fill="url(#bgGrad)" stroke="#00f5d4" stroke-width="4" class="pulse-border" />
  <rect x="12" y="12" width="976" height="316" rx="8" fill="none" stroke="#ff006e" stroke-width="2" stroke-dasharray="10,6" />

  <!-- Synthwave Retro Floor Grid -->
  <rect x="14" y="210" width="972" height="116" fill="url(#pixelGrid)" />
  <line x1="14" y1="210" x2="986" y2="210" stroke="#ff006e" stroke-width="2" filter="url(#glow)" />

  <!-- Pixel Stars in Background -->
  <g fill="#ffffff" opacity="0.7">
    <rect x="65" y="65" width="4" height="4" />
    <rect x="140" y="95" width="3" height="3" fill="#00f5d4" />
    <rect x="260" y="55" width="4" height="4" />
    <rect x="780" y="60" width="4" height="4" fill="#ffbe0b" />
    <rect x="890" y="100" width="3" height="3" />
    <rect x="930" y="58" width="4" height="4" fill="#ff006e" />
    <rect x="85" y="165" width="3" height="3" fill="#ffbe0b" />
    <rect x="915" y="170" width="4" height="4" fill="#00f5d4" />
  </g>

  <!-- TOP ARCADE HUD BAR -->
  <g class="pixel-text" font-size="14">
    <text x="35" y="40" fill="#ff006e">1UP</text>
    <text x="85" y="40" fill="#ffffff">099950</text>

    <text x="240" y="40" fill="#ffbe0b">HI-SCORE</text>
    <text x="355" y="40" fill="#ffffff">999999</text>

    <text x="530" y="40" fill="#00f5d4">STAGE</text>
    <text x="605" y="40" fill="#ffffff">CLOUD-RUN-01</text>

    <!-- Pixel Hearts (Lives) -->
    <text x="820" y="40" fill="#ff006e" font-size="16">♥ ♥ ♥</text>
    <text x="905" y="40" fill="#38b000">LVL 99</text>
  </g>
  <line x1="25" y1="50" x2="975" y2="50" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.4" />

  <!-- 8-BIT PIXEL INVADER / BOT ICONS (LEFT & RIGHT) -->
  <g class="float-slow" fill="#00f5d4" filter="url(#glow)" transform="translate(52, 92) scale(3.2)">
    <rect x="3" y="0" width="2" height="1" />
    <rect x="7" y="0" width="2" height="1" />
    <rect x="4" y="1" width="1" height="1" />
    <rect x="6" y="1" width="1" height="1" />
    <rect x="2" y="2" width="7" height="1" />
    <rect x="1" y="3" width="2" height="1" />
    <rect x="4" y="3" width="3" height="1" />
    <rect x="8" y="3" width="2" height="1" />
    <rect x="0" y="4" width="11" height="1" />
    <rect x="0" y="5" width="1" height="2" />
    <rect x="2" y="5" width="7" height="1" />
    <rect x="10" y="5" width="1" height="2" />
    <rect x="2" y="6" width="1" height="1" />
    <rect x="8" y="6" width="1" height="1" />
    <rect x="3" y="7" width="2" height="1" />
    <rect x="6" y="7" width="2" height="1" />
  </g>

  <g class="float-slow" fill="#ff006e" filter="url(#glow)" transform="translate(912, 92) scale(3.2)">
    <rect x="3" y="0" width="2" height="1" />
    <rect x="7" y="0" width="2" height="1" />
    <rect x="4" y="1" width="1" height="1" />
    <rect x="6" y="1" width="1" height="1" />
    <rect x="2" y="2" width="7" height="1" />
    <rect x="1" y="3" width="2" height="1" />
    <rect x="4" y="3" width="3" height="1" />
    <rect x="8" y="3" width="2" height="1" />
    <rect x="0" y="4" width="11" height="1" />
    <rect x="0" y="5" width="1" height="2" />
    <rect x="2" y="5" width="7" height="1" />
    <rect x="10" y="5" width="1" height="2" />
    <rect x="2" y="6" width="1" height="1" />
    <rect x="8" y="6" width="1" height="1" />
    <rect x="3" y="7" width="2" height="1" />
    <rect x="6" y="7" width="2" height="1" />
  </g>

  <!-- MAIN 16-BIT ARCADE TITLE WITH 3D PIXEL EXTRUSION -->
  <g class="float-slow">
    <!-- Deep 3D Pixel Shadow -->
    <text x="505" y="138" text-anchor="middle" class="title-text" font-size="68" fill="#00f5d4" opacity="0.85">MCP FACTORY</text>
    <text x="503" y="135" text-anchor="middle" class="title-text" font-size="68" fill="#3a0ca3">MCP FACTORY</text>
    <!-- Foreground Chrome/Gold Arcade Text -->
    <text x="500" y="132" text-anchor="middle" class="title-text" font-size="68" fill="url(#arcadeTitle)" filter="url(#glow)">MCP FACTORY</text>
  </g>

  <!-- SUBTITLE QUEST BANNER -->
  <text x="500" y="168" text-anchor="middle" class="pixel-text" font-size="14" fill="#00f5d4">
    [ DECLARATIVE JSON BLUEPRINT &#8594; ANY BACKEND &#8594; GOOGLE CLOUD RUN ]
  </text>

  <!-- POWER-UP CARTRIDGE SLOTS -->
  <g class="pixel-text" font-size="12" text-anchor="middle">
    <!-- Slot 1 -->
    <rect x="115" y="190" width="135" height="30" rx="4" fill="#10002b" stroke="#00f5d4" stroke-width="2" />
    <text x="182" y="210" fill="#00f5d4">⚡ REST API</text>

    <!-- Slot 2 -->
    <rect x="265" y="190" width="140" height="30" rx="4" fill="#10002b" stroke="#ff006e" stroke-width="2" />
    <text x="335" y="210" fill="#ff006e">🔮 GRAPHQL</text>

    <!-- Slot 3 -->
    <rect x="420" y="190" width="155" height="30" rx="4" fill="#10002b" stroke="#ffbe0b" stroke-width="2" />
    <text x="497" y="210" fill="#ffbe0b">🐍 PY PLUGIN</text>

    <!-- Slot 4 -->
    <rect x="590" y="190" width="140" height="30" rx="4" fill="#10002b" stroke="#8338ec" stroke-width="2" />
    <text x="660" y="210" fill="#c77dff">📜 OPENAPI</text>

    <!-- Slot 5 -->
    <rect x="745" y="190" width="150" height="30" rx="4" fill="#10002b" stroke="#38b000" stroke-width="2" />
    <text x="820" y="210" fill="#70e000">☁️ CLOUD RUN</text>
  </g>

  <!-- ARCADE PROGRESS BAR / BOSS LEVEL METER -->
  <g class="pixel-text" font-size="12">
    <text x="215" y="254" fill="#ffffff">BOILERPLATE ELIMINATED:</text>
    <rect x="450" y="242" width="260" height="15" fill="#1a1a2e" stroke="#ffffff" stroke-width="1.5" />
    <rect x="453" y="245" width="254" height="9" fill="url(#cyanNeon)" />
    <text x="722" y="254" fill="#00f5d4">100% [MAX]</text>
  </g>

  <!-- BLINKING "INSERT COIN / JSON" ARCADE PROMPT -->
  <g class="blink">
    <rect x="245" y="276" width="510" height="32" rx="4" fill="#070514" stroke="#ffbe0b" stroke-width="2" />
    <text x="500" y="297" text-anchor="middle" class="pixel-text" font-size="15" fill="#ffbe0b">
      &#9654; INSERT JSON BLUEPRINT TO START [PRESS RUN] &#9664;
    </text>
  </g>

  <!-- CRT Scanlines Overlay -->
  <rect x="4" y="4" width="992" height="332" rx="14" fill="url(#scanlines)" pointer-events="none" />
</svg>
